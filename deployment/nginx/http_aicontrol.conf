# AiControl — nginx (host deploy)
#
# Domains:
#   ai-control.24ai-spbconsult.ru  — SPA + same-origin messaging / PartyHome
#   api-control.24ai-spbconsult.ru — FastAPI control-plane (:8000) + WS
#
# Install:
#   1. Edit frontend root path below (AIC_FRONTEND_ROOT).
#   2. sudo cp deployment/nginx/aicontrol.conf /etc/nginx/sites-available/aicontrol.conf
#   3. sudo ln -sf /etc/nginx/sites-available/aicontrol.conf /etc/nginx/sites-enabled/
#   4. First boot without TLS: comment out both "listen 443" server blocks, nginx -t && reload
#   5. sudo certbot --nginx -d ai-control.24ai-spbconsult.ru -d api-control.24ai-spbconsult.ru
#   6. Uncomment/adjust SSL paths if certbot did not rewrite them; nginx -t && reload
#
# prod.env / init_env.sh:
#   DOMAIN=ai-control.24ai-spbconsult.ru
#   DOMAIN_API=api-control.24ai-spbconsult.ru
#   USE_HTTPS=true
#
# Local ports (dist/prod/run.sh up):
#   :3000 frontend (optional if nginx serves static)
#   :8000 run_app   :8002 run_api   :8003 aicontrol-ai (Rust)
#   :8792 messaging :8989 partyhome

# ── Edit on server ──────────────────────────────────────────────────
# Built SPA directory (make -f Makefile.build linux-amd64 → dist/prod/frontend)
# Example: /home/deploy/AiControl/dist/prod/frontend
# (nginx "root" must be a literal path — do not use a $variable here)

upstream aic_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream aic_dev_api {
    server 127.0.0.1:8002;
    keepalive 8;
}

upstream aic_ai {
    server 127.0.0.1:8003;
    keepalive 8;
}

upstream aic_messaging {
    server 127.0.0.1:8792;
    keepalive 16;
}

upstream aic_partyhome {
    server 127.0.0.1:8989;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ═══════════════════════════════════════════════════════════════════
# Frontend — HTTP
# ═══════════════════════════════════════════════════════════════════
server {
    listen 80;
    listen [::]:80;
    server_name ai-control.24ai-spbconsult.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ═══════════════════════════════════════════════════════════════════
# Frontend — HTTPS
# ═══════════════════════════════════════════════════════════════════
server {
    listen 80;
    listen [::]:80;
    server_name ai-control.24ai-spbconsult.ru;

    root /opt/aicontrol/dist/prod/frontend;
    index index.html;

    client_max_body_size 64m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Messaging — SPA uses same-origin /api/messaging (no VITE_MESSAGING_URL)
    location /api/messaging/ {
        proxy_pass http://aic_messaging;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /api/messaging {
        return 301 /api/messaging/;
    }

    # PartyHome WebSocket — HTTP/1.1 Upgrade (HTTP/2 curl will 400 without --http1.1)
    location = /api/partyhome/ws {
        proxy_pass http://127.0.0.1:8989/ws;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # PartyHome HTTP — strip /api/partyhome → /api/v1/…, /health
    location /api/partyhome/ {
        rewrite ^/api/partyhome/?(.*)$ /$1 break;
        proxy_pass http://aic_partyhome;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /api/partyhome {
        return 301 /api/partyhome/;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /runtime-config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /datacode-docs {
        try_files /datacode-docs/index.html =404;
    }

    location = /datacode-docs/ {
        try_files /datacode-docs/index.html =404;
    }

    location = /datacode-docs/index.html {
        try_files /datacode-docs/index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}

# ═══════════════════════════════════════════════════════════════════
# API — HTTP
# ═══════════════════════════════════════════════════════════════════
server {
    listen 80;
    listen [::]:80;
    server_name api-control.24ai-spbconsult.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ═══════════════════════════════════════════════════════════════════
# API — HTTPS
# ═══════════════════════════════════════════════════════════════════
server {
    listen 80;
    listen [::]:80;
    server_name api-control.24ai-spbconsult.ru;

    client_max_body_size 256m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Developer ingest API (run_api) — https://api-control…/ext/api/v1/ingest/...
    location /ext/ {
        proxy_pass http://aic_dev_api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # AI service (aicontrol-ai Rust) — https://api-control…/ai-api/api/v1/chat/...
    location /ai-api/ {
        proxy_pass http://aic_ai/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Optional messaging on API host (SPA still uses frontend origin by default)
    location /api/messaging/ {
        proxy_pass http://aic_messaging;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Control plane (run_app) — /api, /auth, /admin, /static, /ws/realtime, /docs
    location / {
        proxy_pass http://aic_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
