# V1 minimal: статика + reverse-proxy (повторяет proxy из vite.config.ts).
# Все сервисы делят один network namespace → upstream'ы на 127.0.0.1.
worker_processes 1;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 200m;
    access_log off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 3000;
        root /usr/share/nginx/html;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;

        location = /nginx-health { return 200 "ok\n"; }

        location /api/messaging  { proxy_pass http://127.0.0.1:8792; }
        location /api/partyhome/ { proxy_pass http://127.0.0.1:8989/; }
        location /ai-api/        { proxy_pass http://127.0.0.1:8003/; }
        location /auth           { proxy_pass http://127.0.0.1:8000; }
        location /admin          { proxy_pass http://127.0.0.1:8000; }
        location /api            { proxy_pass http://127.0.0.1:8000; }
        location /static         { proxy_pass http://127.0.0.1:8000; }
        location /ws             { proxy_pass http://127.0.0.1:8000; }

        location = /datacode-docs { return 301 /datacode-docs/; }
        location /assets/ { expires 7d; try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
